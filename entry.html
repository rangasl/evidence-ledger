<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entry — Evidence Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="./">Evidence Ledger</a>
    <nav aria-label="Main">
      <a href="./#ledger">Ledger</a>
      <a href="research.html">Research</a>
      <a href="./#method">Method</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <article class="entry">
    <a class="back" href="./#ledger">All verdicts</a>
    <div id="head"></div>
    <div id="body"><p>Loading the entry.</p></div>
  </article>
</main>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function main() {
  const date = new URLSearchParams(location.search).get('day');
  const { days } = await (await fetch('ledger.json')).json();
  const d = days.find(x => x.date === date);
  if (!d) {
    document.getElementById('body').innerHTML = '<p>There is no entry for that date. <a href="./#ledger">See all verdicts</a>.</p>';
    return;
  }
  document.title = `Day ${d.day}: ${d.title} — Evidence Ledger`;
  let md = await (await fetch(d.file)).text();
  // Title, facts and verdict lines are shown in the header; drop them from the body.
  md = md.replace(/^# .*\n/, '').replace(/^\*\*Track:\*\*.*\n/m, '').replace(/^\*\*Verdict:\*\*.*\n/m, '');
  const v = d.verdict.charAt(0) + d.verdict.slice(1).toLowerCase();
  document.getElementById('head').innerHTML = `
    <h1>${esc(d.title)}</h1>
    <p class="facts">Day ${d.day}, ${d.date}. ${d.track === 'FW' ? 'Free will' : 'Simulation'} track, claim ${esc(d.id)}. ${esc(d.source)}</p>
    <div class="verdict-banner" data-v="${d.verdict}">
      <span class="stamp" data-v="${d.verdict}">${v}</span>
      <p>${esc(d.summary)}</p>
    </div>`;
  document.getElementById('body').innerHTML = marked.parse(md);
  document.querySelectorAll('#body a').forEach(a => { a.rel = 'noopener'; });
}
main().catch(() => {
  document.getElementById('body').innerHTML = '<p>The entry could not be loaded. Refresh the page, or read it on GitHub.</p>';
});
</script>
</body>
</html>
